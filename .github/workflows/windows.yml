name: Windows branch
on:
  push:
    branches: [windows]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install evdev pyusb
      - run: python -m unittest discover -s desktop -p 'test_*.py'
