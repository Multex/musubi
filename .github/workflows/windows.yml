name: Windows branch
on:
  push:
    branches: [windows]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu's own Python, because the GTK bindings the Linux app needs only come as system packages.
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-evdev python3-usb python3-tk
      - run: python3 -m unittest discover -s desktop/tests -p 'test_*.py'

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Get ViGEmClient.dll
        shell: pwsh
        run: |
          $url = 'https://raw.githubusercontent.com/yannbouteiller/vgamepad/74318af82918336f8c8f311f4cfb26cdda0dccab/vgamepad/win/vigem/client/x64/ViGEmClient.dll'
          Invoke-WebRequest $url -OutFile desktop/windows/ViGEmClient.dll
          $hash = (Get-FileHash desktop/windows/ViGEmClient.dll -Algorithm SHA256).Hash
          if ($hash -ne '2BF0CB1D809039573C922737D298A1653D4DBC61408060FF45A9BCFDE82E97D2') { throw "ViGEmClient.dll changed: $hash" }
      # Without the driver the pad test skips itself, so a runner that refuses it doesn't block the build.
      - name: Install the ViGEmBus driver
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 5
        run: |
          Invoke-WebRequest 'https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe' -OutFile vigembus.exe
          Start-Process ./vigembus.exe -ArgumentList '/exenoui', '/qn', '/norestart' -Wait
      - run: pip install pyinstaller PyAudioWPatch
      - run: python -m unittest discover -s desktop/tests -p 'test_win*.py' -v
      - name: Build the exe
        shell: pwsh
        run: |
          "BUILD = '$("${{ github.sha }}".Substring(0, 7))'" | Out-File desktop/windows/build.py -Encoding utf8
          pyinstaller --onefile --console --name Musubi-test --paths desktop --paths desktop/windows --add-binary "desktop/windows/ViGEmClient.dll;." desktop/windows/main.py
      - name: Start the exe once
        shell: pwsh
        run: |
          $musubi = Start-Process dist/Musubi-test.exe -PassThru -RedirectStandardOutput out.txt
          Start-Sleep 10
          $log = "$env:LOCALAPPDATA/musubi/musubi.log"
          Get-Content out.txt, $log -ErrorAction SilentlyContinue
          if ($musubi.HasExited) { throw 'The exe stopped by itself.' }
          Stop-Process $musubi
          if (-not (Select-String -Path $log -Pattern 'listening' -Quiet)) { throw 'The exe never started listening.' }
      - name: Build the window exe
        shell: pwsh
        run: pyinstaller --onefile --windowed --name Musubi-window-test --paths desktop --paths desktop/windows --add-binary "desktop/windows/ViGEmClient.dll;." desktop/windows/app.py
      - name: Start the window exe once
        shell: pwsh
        run: |
          $musubi = Start-Process dist/Musubi-window-test.exe -PassThru
          Start-Sleep 10
          $log = "$env:LOCALAPPDATA/musubi/musubi.log"
          Get-Content $log -ErrorAction SilentlyContinue
          if ($musubi.HasExited) { throw 'The window exe stopped by itself.' }
          Stop-Process $musubi
          if (-not (Select-String -Path $log -Pattern 'window open' -Quiet)) { throw 'The window never opened.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Musubi-test
          path: dist/*.exe

  # An experiment: the Linux GTK window packaged for Windows. It is separate, so it can fail without touching the exes.
  gtk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get GTK 4
        id: gtk
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/wingtk/gvsbuild/releases/download/2026.10.0/GTK4_Gvsbuild_2026.10.0_x64.zip' -OutFile gtk.zip
          # shortcut: the download is pinned by release only, add a SHA256 check like the ViGEmClient one before this ships to users
          (Get-FileHash gtk.zip -Algorithm SHA256).Hash
          7z x gtk.zip -oC:\gtk | Out-Null
          Get-ChildItem C:\gtk -Recurse -Filter *.whl | ForEach-Object { $_.FullName }
          $wheel = (Get-ChildItem C:\gtk -Recurse -Filter 'pygobject*.whl' | Select-Object -First 1).Name
          # The wheels only fit the Python they were built with.
          if ($wheel -notmatch 'cp3(\d+)') { throw "No PyGObject wheel found: $wheel" }
          "python=3.$($Matches[1])" >> $env:GITHUB_OUTPUT
          'C:\gtk\bin' >> $env:GITHUB_PATH
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.gtk.outputs.python }}
      - name: Build the GTK test
        shell: pwsh
        run: |
          pip install pyinstaller
          Get-ChildItem C:\gtk\wheels -Include 'pygobject*.whl', 'pycairo*.whl' -Recurse | ForEach-Object { pip install --force-reinstall $_.FullName }
          # Python no longer looks on PATH for the DLLs a module needs, so every Python started here is told where GTK's are.
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          "import os; os.add_dll_directory(r'C:\gtk\bin')" | Out-File -Encoding ascii (Join-Path $site 'gtk.pth')
          python -c "import gi; gi.require_version('Gtk', '4.0'); from gi.repository import Gtk; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version(), Gtk.get_micro_version())"
          if ($LASTEXITCODE) { throw 'Python cannot load GTK.' }
          pyinstaller --noconfirm desktop/windows/gtk_spike.spec
          "{0:N1} MB unpacked" -f ((Get-ChildItem dist/Musubi-gtk-test -Recurse | Measure-Object Length -Sum).Sum / 1MB)
      - name: Start the GTK test with each renderer
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $log = "$env:LOCALAPPDATA/musubi/gtk-test.log"
          New-Item -ItemType Directory screens | Out-Null
          $env:MUSUBI_TEST_SECONDS = '14'
          foreach ($renderer in 'cairo', 'gl') {
            $env:GSK_RENDERER = $renderer
            $test = Start-Process dist/Musubi-gtk-test/Musubi-gtk-test.exe -PassThru
            Start-Sleep 7
            $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $picture = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            [System.Drawing.Graphics]::FromImage($picture).CopyFromScreen($screen.Left, $screen.Top, 0, 0, $picture.Size)
            $picture.Save("$PWD/screens/$renderer.png")
            if (-not $test.WaitForExit(60000)) { Stop-Process $test; Get-Content $log; throw "The GTK test did not close by itself with $renderer." }
          }
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern 'after 10 s' -Quiet)) { throw 'The GTK window never opened.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Musubi-gtk-screen
          path: screens
      - uses: actions/upload-artifact@v4
        with:
          name: Musubi-gtk-test
          path: dist/Musubi-gtk-test
