name: Windows branch
on:
  push:
    branches: [windows]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu's own Python, because the GTK bindings the Linux app needs only come as system packages.
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-evdev python3-usb python3-tk
      - run: python3 -m unittest discover -s desktop/tests -p 'test_*.py'

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Get ViGEmClient.dll
        shell: pwsh
        run: |
          $url = 'https://raw.githubusercontent.com/yannbouteiller/vgamepad/74318af82918336f8c8f311f4cfb26cdda0dccab/vgamepad/win/vigem/client/x64/ViGEmClient.dll'
          Invoke-WebRequest $url -OutFile desktop/windows/ViGEmClient.dll
          $hash = (Get-FileHash desktop/windows/ViGEmClient.dll -Algorithm SHA256).Hash
          if ($hash -ne '2BF0CB1D809039573C922737D298A1653D4DBC61408060FF45A9BCFDE82E97D2') { throw "ViGEmClient.dll changed: $hash" }
      # Without the driver the pad test skips itself, so a runner that refuses it doesn't block the build.
      - name: Install the ViGEmBus driver
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 5
        run: |
          Invoke-WebRequest 'https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe' -OutFile vigembus.exe
          Start-Process ./vigembus.exe -ArgumentList '/exenoui', '/qn', '/norestart' -Wait
      - run: pip install pyinstaller PyAudioWPatch
      - run: python -m unittest discover -s desktop/tests -p 'test_win*.py' -v
      - name: Build the exe
        shell: pwsh
        run: |
          "BUILD = '$("${{ github.sha }}".Substring(0, 7))'" | Out-File desktop/windows/build.py -Encoding utf8
          pyinstaller --onefile --console --name Musubi-test --paths desktop --paths desktop/windows --add-binary "desktop/windows/ViGEmClient.dll;." desktop/windows/main.py
      - name: Start the exe once
        shell: pwsh
        run: |
          $musubi = Start-Process dist/Musubi-test.exe -PassThru -RedirectStandardOutput out.txt
          Start-Sleep 10
          $log = "$env:LOCALAPPDATA/musubi/musubi.log"
          Get-Content out.txt, $log -ErrorAction SilentlyContinue
          if ($musubi.HasExited) { throw 'The exe stopped by itself.' }
          Stop-Process $musubi
          if (-not (Select-String -Path $log -Pattern 'listening' -Quiet)) { throw 'The exe never started listening.' }
      - name: Build the window exe
        shell: pwsh
        run: pyinstaller --onefile --windowed --name Musubi-window-test --paths desktop --paths desktop/windows --add-binary "desktop/windows/ViGEmClient.dll;." desktop/windows/app.py
      - name: Start the window exe once
        shell: pwsh
        run: |
          $musubi = Start-Process dist/Musubi-window-test.exe -PassThru
          Start-Sleep 10
          $log = "$env:LOCALAPPDATA/musubi/musubi.log"
          Get-Content $log -ErrorAction SilentlyContinue
          if ($musubi.HasExited) { throw 'The window exe stopped by itself.' }
          Stop-Process $musubi
          if (-not (Select-String -Path $log -Pattern 'window open' -Quiet)) { throw 'The window never opened.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Musubi-test
          path: dist/*.exe
